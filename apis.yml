description: 'CIRCOR International is a flow-control manufacturer headquartered in Burlington, Massachusetts,
  building mission-critical pumps, valves and flow-control products for the Industrial and Aerospace &
  Defense markets through brands including IMO, Allweiler, Warren, RTK, Schroedahl, Hale Hamilton, Aerodyne
  Controls, Leslie Controls, Circle Seal Controls and Zenith. The company was established in 1999, sells
  directly and through sales partners to roughly 14,000 customers in about 100 countries with approximately
  3,100 employees, and was taken private by KKR on 18 October 2023, after which its shares ceased trading
  on the NYSE. CIRCOR publishes no developer portal, API reference or machine-readable contract of any
  kind: its only software product on the public web is CIRCORSmart, a closed iOS/Android/desktop maintenance-tracking
  app for IMO pump series whose admin console and backend are unauthenticated-inaccessible Azure applications
  with no published interface.'
